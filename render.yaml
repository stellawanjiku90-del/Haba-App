databases:
  - name: haba-data-dev
    plan: free
    region: frankfurt

services:
  - type: web
    name: haba-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix api
    startCommand: npm run migrate --prefix api && npm start --prefix api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: haba-data-dev
          property: connectionString
      - key: APP_ORIGIN
        value: https://haba-app.onrender.com
      - key: PHONE_HASH_KEY
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_HASH_KEY
        generateValue: true
      - key: TOKEN_SIGNING_KEY
        generateValue: true
      - key: OTP_HASH_KEY
        generateValue: true
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: LENDING_ENABLED
        value: "false"
